version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: customer_churn_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - churn_network

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: customer_churn_ml_service
    restart: always
    ports:
      - "5001:5001"
    environment:
      - ML_PORT=5001
      - PYTHONUNBUFFERED=1
    networks:
      - churn_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: customer_churn_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/churn_db
      - ML_SERVICE_URL=http://ml-service:5001
      - PUBLIC_BASE_URL=http://localhost:5000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@churnpredict.com}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
    depends_on:
      - mongodb
      - ml-service
    networks:
      - churn_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: customer_churn_client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - churn_network

networks:
  churn_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
